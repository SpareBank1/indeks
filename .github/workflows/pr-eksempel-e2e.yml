name: PR - Eksempel e2e

on:
    pull_request:
        branches: [main]
        paths:
            - 'indeks-eksempel/**'
            - 'indeks-react/**'
            - 'indeks-web/**'
            - 'indeks-css/**'
            - 'indeks-tokens/**'
            - 'indeks-utils/**'

concurrency:
    group: eksempel-e2e-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    eksempel-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: '24'
                  cache: 'pnpm'
                  # Uten denne tar setup-node versjonen som ligger i verktøycachen på
                  # runneren, og den kan være eldre enn siste sikkerhetsrelease.
                  check-latest: true

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Bygg eksempelappen (med avhengigheter)
              run: pnpm --filter @sb1/indeks-eksempel... build

            - name: Kjør e2e i Docker
              working-directory: ./indeks-eksempel
              run: docker compose run --rm playwright

            - name: Last opp Playwright-rapport
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: eksempel-e2e-report
                  path: indeks-eksempel/playwright-report/
                  retention-days: 30

            - name: Last opp testresultater
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: always()
              with:
                  name: eksempel-e2e-test-results
                  path: indeks-eksempel/test-results/
                  retention-days: 30
