name: PR - Playwright-tester (skip)

# Rapporterer en grønn "playwright-tests"-check for PR-er som IKKE rører
# kode-pathene i pr-playwright.yml (typisk docs-only-PR-er). Uten dette blir
# den path-filtrerte Playwright-jobben aldri kjørt, og den påkrevde checken
# i main-rulesettet fullføres aldri – slik at PR-en henger på BLOCKED.
# paths-ignore her må speile paths i pr-playwright.yml.

on:
    pull_request:
        branches: [main]
        paths-ignore:
            - 'indeks-storybook/**'
            - 'indeks-react/**'
            - 'indeks-web/**'
            - 'indeks-css/**'
            - 'indeks-tokens/**'
            - 'indeks-utils/**'

concurrency:
    group: playwright-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    playwright-tests:
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Ingen kode-endringer – hopper over Playwright
              run: echo "Ingen endringer i kode-pathene; Playwright-tester er ikke nødvendig."
