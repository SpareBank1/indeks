name: Release - Opprett versjons-PR

on:
    push:
        branches:
            - main
            - beta

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    versjons-pr:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout code
              # zizmor: ignore[artipacked] - persist-credentials trengs for git push av versjons-branchen
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            # .changeset/pre.json styrer pre-modus. mode "pre" gir betaer, mode "exit" gjør at neste
            # changeset version lager stabile versjoner av betaens changesets og sletter pre.json.
            # main: betaer skal aldri lages her, men exit er slik en ferdig beta kommer inn.
            # beta: bare betaer. I exit venter vi på merge til main, ellers lager beta en stabil release.
            - name: Sjekk pre-modus
              id: pre
              env:
                  BRANCH: ${{ github.ref_name }}
              run: |
                  MODE=$( [ -f .changeset/pre.json ] && node -p "require('./.changeset/pre.json').mode" || echo ingen )
                  echo "pre-modus: $MODE"
                  case "$BRANCH:$MODE" in
                      main:pre)
                          echo "::error::.changeset/pre.json står i pre-modus på main. Kjør pnpm changeset pre exit på beta før merge."
                          exit 1 ;;
                      beta:ingen)
                          echo "::error::.changeset/pre.json mangler på beta. Kjør pnpm changeset pre enter beta."
                          exit 1 ;;
                      beta:exit)
                          echo "::notice::Betaen er avsluttet med pre exit. Versjoneres på main etter merge."
                          echo "hopp=true" >> "$GITHUB_OUTPUT" ;;
                  esac

            # Bare versjonering. Publiseringen skjer i release-publiser.yml, fordi
            # changesets/action alltid velger versjonering når det finnes changesets —
            # den kan derfor ikke gjenbrukes til en schedulert publisering.
            - name: Opprett eller oppdater versjons-PR
              if: steps.pre.outputs.hopp != 'true'
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: pnpm ci:version
                  commit-message: 'chore: version packages'
                  pr-title: 'chore: version packages'
                  # v2 leser ikke lenger GITHUB_TOKEN fra env
                  github-token: ${{ secrets.GITHUB_TOKEN }}
