name: Release - Opprett versjons-PR

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    versjons-pr:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout code
              # zizmor: ignore[artipacked] - persist-credentials trengs for git push av versjons-branchen
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            # Bare versjonering. Publiseringen skjer i release-publiser.yml, fordi
            # changesets/action alltid velger versjonering når det finnes changesets —
            # den kan derfor ikke gjenbrukes til en schedulert publisering.
            - name: Opprett eller oppdater versjons-PR
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: pnpm ci:version
                  commit-message: 'chore: version packages'
                  pr-title: 'chore: version packages'
                  # v2 leser ikke lenger GITHUB_TOKEN fra env
                  github-token: ${{ secrets.GITHUB_TOKEN }}
