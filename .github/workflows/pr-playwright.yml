name: PR - Playwright-tester

# Kjører på alle PR-er mot main (ingen paths-filter). playwright-tests er en
# påkrevd check i main-rulesettet; en path-filtrert trigger ville aldri
# fullføre checken på PR-er utenfor kode-pathene, og de ville henge på BLOCKED.
on:
    pull_request:
        branches: [main]

concurrency:
    group: playwright-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    playwright-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build Storybook (med avhengigheter)
              run: pnpm build-storybook

            - name: Run Playwright tests in Docker
              working-directory: ./indeks-storybook
              run: docker compose run --rm playwright

            - name: Last opp Playwright-rapport
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: playwright-report
                  path: indeks-storybook/playwright-report/
                  retention-days: 30

            - name: Last opp testresultater
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: always()
              with:
                  name: test-results
                  path: indeks-storybook/test-results/
                  retention-days: 30
